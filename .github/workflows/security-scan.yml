name: Security Scan

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 1) Produce a SARIF report. This step never fails (exit-code 0); the
      #    policy gate is enforced separately below so it works on every plan.
      - name: Trivy IaC scan (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      # Upload is BEST-EFFORT: GitHub code scanning needs Advanced Security on
      # private repos (paid). On a free plan this step errors, so we let it fail
      # softly - the exit-code gate below is what actually enforces the policy.
      # Where Advanced Security IS available it also lands in the Security tab.
      - name: Upload SARIF to GitHub Security (best-effort)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-iac.sarif

      # 2) THE GATE - fails the job on CRITICAL/HIGH IaC misconfig. Plan-agnostic.
      #    Accepted baseline findings live in .trivyignore.
      - name: Trivy IaC gate (fail on findings)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: .trivyignore

      # 3) Secret scan - fails the job if a hardcoded secret is committed.
      #    Runs independently so it reports even when the IaC gate fails.
      - name: Trivy secret scan (fail on findings)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
