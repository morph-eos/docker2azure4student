version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: terraform
    directories:
      - /
      - /modules/*
    schedule:
      interval: weekly
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]
    ignore:
      # A major of the provider is a reviewed change (a plan against the real state), not an automatic pull request.
      - dependency-name: hashicorp/azurerm
        update-types: ["version-update:semver-major"]
