name: Deploy from sync bundle

on:
  push:
    branches:
      - 'sync/**'
  workflow_dispatch:
    inputs:
      sync_branch:
        description: 'sync/<timestamp>-<sha> branch to deploy'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      sync_branch: ${{ steps.sync-branch.outputs.value }}
      image_tag: ${{ steps.manifest.outputs.image_tag }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sync_branch || github.ref_name }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: 'true'
      TERRAFORM_WORKING_DIR: '.'
      CONTAINER_SERVICE_NAME: 'app-service'
      CONTAINER_HTTP_PORT: '80'
      CONTAINER_INTERNAL_HTTP_PORT: '8080'
      CONTAINER_HTTPS_PORT: '443'
      CONTAINER_INTERNAL_HTTPS_PORT: '8081'
    steps:
      - name: Determine sync branch
        id: sync-branch
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -z "${{ github.event.inputs.sync_branch }}" ]]; then
              echo "sync_branch input is required" >&2
              exit 1
            fi
            BRANCH="${{ github.event.inputs.sync_branch }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          echo "value=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sync-branch.outputs.value }}
          fetch-depth: 0

      - name: Restore terraform.tfvars from secret
        run: |
          if [[ -z "${{ secrets.TFVARS_B64 }}" ]]; then
            echo "Missing TFVARS_B64 secret" >&2
            exit 1
          fi
          echo "${{ secrets.TFVARS_B64 }}" | base64 -d > terraform.tfvars

      - name: Load deployment secrets
        id: load-secrets
        run: |
          set -euo pipefail
          missing=0
          append_var() {
            local key="$1"
            local value="$2"
            local label="$3"
            local required="${4:-true}"
            if [[ -z "$value" ]]; then
              if [[ "$required" == "true" ]]; then
                echo "Missing secret: $label" >&2
                missing=1
              fi
              return
            fi
            if [[ "$value" == *$'\n'* ]]; then
              printf '%s<<__ENV__\n%s\n__ENV__\n' "$key" "$value" >> "$GITHUB_ENV"
            else
              printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
            fi
          }

          append_var IMAGE_REGISTRY "${{ secrets.IMAGE_REGISTRY }}" IMAGE_REGISTRY
          append_var IMAGE_NAME "${{ secrets.IMAGE_NAME }}" IMAGE_NAME
          append_var REGISTRY_LOGIN_SERVER "${{ secrets.REGISTRY_LOGIN_SERVER }}" REGISTRY_LOGIN_SERVER
          append_var CONTAINER_REGISTRY_USERNAME "${{ secrets.CONTAINER_REGISTRY_USERNAME }}" CONTAINER_REGISTRY_USERNAME
          append_var CONTAINER_REGISTRY_PASSWORD "${{ secrets.CONTAINER_REGISTRY_PASSWORD }}" CONTAINER_REGISTRY_PASSWORD
          append_var VM_SSH_USERNAME "${{ secrets.VM_SSH_USERNAME }}" VM_SSH_USERNAME
          append_var VM_SSH_KEY "${{ secrets.VM_SSH_KEY }}" VM_SSH_KEY
          append_var APP_ENV_VARS_B64 "${{ secrets.APP_ENV_VARS_B64 }}" APP_ENV_VARS_B64

          if [[ $missing -ne 0 ]]; then
            exit 1
          fi
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure remote state backend
        id: backend
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          set -euo pipefail

          read_tfvar() {
            grep -E "^[[:space:]]*$1[[:space:]]*=" terraform.tfvars 2>/dev/null \
              | head -1 | sed -E 's/.*=[[:space:]]*"?([^"#]+)"?.*/\1/' | tr -d '[:space:]'
          }

          # Naming coerente con l'applicazione (vedi variables.tf / locals.tf)
          RG="tfstate-rg"
          CONTAINER="tfstate"
          KEY="docker2azure.tfstate"

          LOC="$(read_tfvar location)";              LOC="${LOC:-francecentral}"
          ENV_NAME="$(read_tfvar environment_name)";  ENV_NAME="${ENV_NAME:-student-app}"

          # Storage account: <prefix-app><suffix-deterministico>. Deve essere
          # globalmente unico, solo minuscole/numeri, 3-24 caratteri.
          PREFIX="$(printf '%s' "$ENV_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9' | cut -c1-12)"
          PREFIX="${PREFIX:-app}"
          SUB_ID="$(az account show --query id -o tsv)"
          SUFFIX="$(printf '%s' "$SUB_ID" | sha256sum | cut -c1-8)"
          SA="${PREFIX}tfst${SUFFIX}"

          echo "State backend -> rg=$RG sa=$SA container=$CONTAINER key=$KEY loc=$LOC"

          # create-if-not-exists: idempotente. Se mancano, li crea; se ci sono, li riusa.
          az group show -n "$RG" >/dev/null 2>&1 || az group create -n "$RG" -l "$LOC" -o none

          if ! az storage account show -n "$SA" -g "$RG" >/dev/null 2>&1; then
            echo "Creating storage account $SA"
            az storage account create -n "$SA" -g "$RG" -l "$LOC" \
              --sku Standard_LRS --kind StorageV2 \
              --min-tls-version TLS1_2 --allow-blob-public-access false -o none
            # Versioning + soft delete: consentono il recupero dello state in caso di errore.
            az storage account blob-service-properties update -n "$SA" -g "$RG" \
              --enable-versioning true \
              --enable-delete-retention true --delete-retention-days 7 -o none
          fi

          ACCOUNT_KEY="$(az storage account keys list -n "$SA" -g "$RG" --query '[0].value' -o tsv)"
          az storage container show -n "$CONTAINER" --account-name "$SA" --account-key "$ACCOUNT_KEY" >/dev/null 2>&1 \
            || az storage container create -n "$CONTAINER" --account-name "$SA" --account-key "$ACCOUNT_KEY" -o none

          # Config del backend passata a 'init' a runtime: niente backend.hcl, niente secret.
          echo "args=-backend-config=resource_group_name=$RG -backend-config=storage_account_name=$SA -backend-config=container_name=$CONTAINER -backend-config=key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          terraform init -input=false -reconfigure ${{ steps.backend.outputs.args }}

      - name: Export Terraform vars for workflow
        id: tfvars-meta
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          set -euo pipefail
          python ./scripts/tfvars_meta.py terraform.tfvars subscription_id environment_name vm_public_ip_static db_admin_username db_admin_password blob_storage_enabled > vars.tmp
          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
            case "$key" in
              subscription_id)
                echo "AZURE_SUBSCRIPTION_ID=${value}" >> "$GITHUB_ENV"
                ;;
              environment_name)
                echo "ENVIRONMENT_NAME=${value}" >> "$GITHUB_ENV"
                ;;
              vm_public_ip_static)
                echo "VM_PUBLIC_IP_STATIC=${value}" >> "$GITHUB_ENV"
                ;;
              db_admin_username)
                printf '::add-mask::%s\n' "$value"
                echo "DB_ADMIN_USERNAME=${value}" >> "$GITHUB_ENV"
                ;;
              db_admin_password)
                printf '::add-mask::%s\n' "$value"
                echo "DB_ADMIN_PASSWORD=${value}" >> "$GITHUB_ENV"
                ;;
              blob_storage_enabled)
                echo "BLOB_STORAGE_ENABLED=${value}" >> "$GITHUB_ENV"
                ;;
            esac
          done < vars.tmp
          rm vars.tmp

      - name: Import existing Azure resources
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        env:
          AZURE_SUBSCRIPTION_ID: ${{ steps.tfvars-meta.outputs.subscription_id }}
          ENVIRONMENT_NAME: ${{ steps.tfvars-meta.outputs.environment_name }}
        run: |
          set -euo pipefail

          # With persistent remote state, adopting pre-existing resources is only
          # needed the FIRST time. If the state already tracks resources, skip the
          # whole import phase: it avoids noisy no-op imports and is safe during the
          # monolith -> modules migration (the moved{} blocks remap addresses on apply).
          if [[ -n "$(terraform state list 2>/dev/null)" ]]; then
            echo "State already populated: skipping resource adoption."
            exit 0
          fi

          tf_contains() {
            terraform state list 2>/dev/null | grep -q "^$1$"
          }

          import_if_exists() {
            local address="$1"
            local resource_id="$2"
            local skip_check="${3:-false}"
            if [[ -z "$resource_id" ]]; then
              echo "Skipping $address: resource id not provided"
              return
            fi
            if tf_contains "$address"; then
              echo "OK: State already tracks $address"
              return
            fi
            echo "INFO: Attempting to import $address"
            echo "  Resource ID: $resource_id"
            if terraform import "$address" "$resource_id" 2>&1; then
              echo "Successfully imported $address"
            else
              echo "Import failed for $address (resource may not exist or is already managed)"
            fi
          }

          normalize_id() {
            local resource_id="$1"
            if [[ -z "$resource_id" ]]; then
              echo ""
              return
            fi
            echo "${resource_id//resourcegroups/resourceGroups}"
          }

          env_name="${ENVIRONMENT_NAME:-student-app}"
          normalized=$(printf '%s' "$env_name" | tr '[:upper:]' '[:lower:]')
          normalized=${normalized// /-}
          prefix=${normalized:0:45}
          subscription="/subscriptions/${AZURE_SUBSCRIPTION_ID}"
          rg_name="${prefix}-rg"
          rg_id="${subscription}/resourceGroups/${rg_name}"

          echo "INFO: Scanning Azure resources for environment: $env_name (prefix: $prefix)"
          echo "   Resource Group: $rg_name"
          echo "   Subscription: $AZURE_SUBSCRIPTION_ID"

          rg_exists=$(az group show --name "$rg_name" --subscription "$AZURE_SUBSCRIPTION_ID" --query id -o tsv --only-show-errors 2>/dev/null || true)
          echo "   RG ID: ${rg_exists:-[not found]}"
          import_if_exists "azurerm_resource_group.main" "$rg_exists"

          vnet_name="${prefix}-vnet"
          vnet_id=$(az network vnet show --subscription "$AZURE_SUBSCRIPTION_ID" -g "$rg_name" -n "$vnet_name" --query id -o tsv --only-show-errors 2>/dev/null || true)
          echo "   VNet ID: ${vnet_id:-[not found]}"
          import_if_exists "module.network.azurerm_virtual_network.main" "$vnet_id"

          subnet_name="${prefix}-vm-subnet"
          subnet_id=$(az network vnet subnet show --subscription "$AZURE_SUBSCRIPTION_ID" -g "$rg_name" --vnet-name "$vnet_name" -n "$subnet_name" --query id -o tsv --only-show-errors 2>/dev/null || true)
          echo "   Subnet ID: ${subnet_id:-[not found]}"
          import_if_exists "module.network.azurerm_subnet.vm" "$subnet_id"

          nsg_name="${prefix}-vm-nsg"
          nsg_id=$(az network nsg show --subscription "$AZURE_SUBSCRIPTION_ID" -g "$rg_name" -n "$nsg_name" --query id -o tsv --only-show-errors 2>/dev/null || true)
          echo "   NSG ID: ${nsg_id:-[not found]}"
          import_if_exists "module.network.azurerm_network_security_group.vm" "$nsg_id"

          pip_name="${prefix}-vm-ip-static"
          pip_id=$(az network public-ip show --subscription "$AZURE_SUBSCRIPTION_ID" -g "$rg_name" -n "$pip_name" --query id -o tsv --only-show-errors 2>/dev/null || true)
          if [[ -z "$pip_id" ]]; then
            pip_name="${prefix}-vm-ip-dynamic"
            pip_id=$(az network public-ip show --subscription "$AZURE_SUBSCRIPTION_ID" -g "$rg_name" -n "$pip_name" --query id -o tsv --only-show-errors 2>/dev/null || true)
          fi
          echo "   Public IP ($pip_name): ${pip_id:-[not found]}"
          import_if_exists "module.network.azurerm_public_ip.vm" "$pip_id"

          nic_name="${prefix}-vm-nic"
          nic_id=$(az network nic show --subscription "$AZURE_SUBSCRIPTION_ID" -g "$rg_name" -n "$nic_name" --query id -o tsv --only-show-errors 2>/dev/null || true)
          echo "   NIC ID: ${nic_id:-[not found]}"
          import_if_exists "module.network.azurerm_network_interface.vm" "$nic_id"

          if [[ -n "$nic_id" && -n "$nsg_id" ]]; then
            import_if_exists "module.network.azurerm_network_interface_security_group_association.vm" "${nic_id}|${nsg_id}" true
          fi

          vm_name="${prefix}-vm"
          vm_id=$(az vm show --subscription "$AZURE_SUBSCRIPTION_ID" -g "$rg_name" -n "$vm_name" --query id -o tsv --only-show-errors 2>/dev/null || true)
          echo "   VM ID: ${vm_id:-[not found]}"
          import_if_exists "module.compute.azurerm_linux_virtual_machine.app" "$vm_id"

          auto_name="${prefix}-aa"
          auto_id=$(normalize_id "$(az resource show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$rg_name" --name "$auto_name" --resource-type "Microsoft.Automation/automationAccounts" --query id -o tsv --only-show-errors 2>/dev/null || true)")
          echo "   Automation Account ID: ${auto_id:-[not found]}"
          if [[ -n "$auto_id" ]]; then
            import_if_exists "module.automation.azurerm_automation_account.ops[0]" "$auto_id"
            module_accounts_id=$(normalize_id "$(az resource show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$rg_name" --name "$auto_name/Az.Accounts" --resource-type "Microsoft.Automation/automationAccounts/modules" --query id -o tsv --only-show-errors 2>/dev/null || true)")
            module_compute_id=$(normalize_id "$(az resource show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$rg_name" --name "$auto_name/Az.Compute" --resource-type "Microsoft.Automation/automationAccounts/modules" --query id -o tsv --only-show-errors 2>/dev/null || true)")
            module_pg_id=$(normalize_id "$(az resource show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$rg_name" --name "$auto_name/Az.PostgreSql" --resource-type "Microsoft.Automation/automationAccounts/modules" --query id -o tsv --only-show-errors 2>/dev/null || true)")
            if [[ -z "$module_accounts_id" ]]; then
              module_accounts_id="${auto_id}/modules/Az.Accounts"
            fi
            if [[ -z "$module_compute_id" ]]; then
              module_compute_id="${auto_id}/modules/Az.Compute"
            fi
            if [[ -z "$module_pg_id" ]]; then
              module_pg_id="${auto_id}/modules/Az.PostgreSql"
            fi
            import_if_exists "module.automation.azurerm_automation_module.az_accounts[0]" "$module_accounts_id"
            import_if_exists "module.automation.azurerm_automation_module.az_compute[0]" "$module_compute_id"
            import_if_exists "module.automation.azurerm_automation_module.az_postgresql[0]" "$module_pg_id"

            delete_schedule() {
              local schedule_name="$1"
              if az automation schedule show --subscription "$AZURE_SUBSCRIPTION_ID" -g "$rg_name" --automation-account-name "$auto_name" --name "$schedule_name" >/dev/null 2>&1; then
                az automation schedule delete --subscription "$AZURE_SUBSCRIPTION_ID" -g "$rg_name" --automation-account-name "$auto_name" --name "$schedule_name" --yes >/dev/null
                echo "Deleted automation schedule $schedule_name"
              else
                echo "Schedule $schedule_name not found, skipping"
              fi
            }

            delete_runbook() {
              local runbook_name="$1"
              if az automation runbook show --subscription "$AZURE_SUBSCRIPTION_ID" -g "$rg_name" --automation-account-name "$auto_name" --name "$runbook_name" >/dev/null 2>&1; then
                az automation runbook delete --subscription "$AZURE_SUBSCRIPTION_ID" -g "$rg_name" --automation-account-name "$auto_name" --name "$runbook_name" --yes >/dev/null
                echo "Deleted automation runbook $runbook_name"
              else
                echo "Runbook $runbook_name not found, skipping"
              fi
            }

            delete_schedule "${prefix}-vm-start"
            delete_schedule "${prefix}-vm-stop"
            delete_schedule "${prefix}-db-backup"
            delete_schedule "${prefix}-snapshot-cleanup"

            delete_runbook "${prefix}-start-vm"
            delete_runbook "${prefix}-stop-vm"
            delete_runbook "${prefix}-db-backup"
            delete_runbook "${prefix}-snapshot"
            delete_runbook "${prefix}-snapshot-cleanup"

            auto_principal=$(az resource show --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$rg_name" --name "$auto_name" --resource-type "Microsoft.Automation/automationAccounts" --query identity.principalId -o tsv --only-show-errors 2>/dev/null || true)
            if [[ -n "$auto_principal" ]]; then
              role_assignment=$(normalize_id "$(az role assignment list --subscription "$AZURE_SUBSCRIPTION_ID" --assignee-object-id "$auto_principal" --scope "$rg_id" --query '[0].id' -o tsv --only-show-errors 2>/dev/null || true)")
              import_if_exists "module.automation.azurerm_role_assignment.automation_rg[0]" "$role_assignment"
            fi
          fi

          pg_id=$(az resource list --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$rg_name" \
            --resource-type "Microsoft.DBforPostgreSQL/flexibleServers" --query "[0].id" -o tsv --only-show-errors 2>/dev/null || true)
          echo "   PostgreSQL ID: ${pg_id:-[not found]}"
          if [[ -n "$pg_id" ]]; then
            import_if_exists "module.database.azurerm_postgresql_flexible_server.db" "$pg_id"
            pg_name=$(basename "$pg_id")
            suffix=${pg_name##${prefix}-pg-}
            if [[ -n "$suffix" && "$suffix" != "$pg_name" ]] && ! tf_contains "module.database.random_string.db_suffix"; then
              echo "INFO: Importing random_string.db_suffix with value: $suffix"
              terraform import module.database.random_string.db_suffix "$suffix" 2>&1 || echo "WARN: Import failed for random_string.db_suffix"
            fi
            import_if_exists "module.database.azurerm_postgresql_flexible_server_database.app_db" "${pg_id}/databases/postgres"
            import_if_exists "module.database.azurerm_postgresql_flexible_server_firewall_rule.azure_services" "${pg_id}/firewallRules/allow-azure-services"
            if [[ "${VM_PUBLIC_IP_STATIC,,}" == "true" ]]; then
              import_if_exists "module.database.azurerm_postgresql_flexible_server_firewall_rule.vm_public_ip[0]" "${pg_id}/firewallRules/allow-vm"
            else
              echo "WARN: Skipping VM firewall rule import: vm_public_ip_static is false"
            fi
          fi

          if [[ "${BLOB_STORAGE_ENABLED,,}" == "true" ]]; then
            blob_sa_id=$(az resource list --subscription "$AZURE_SUBSCRIPTION_ID" --resource-group "$rg_name" \
              --resource-type "Microsoft.Storage/storageAccounts" --query "[0].id" -o tsv --only-show-errors 2>/dev/null || true)
            echo "   Storage Account ID: ${blob_sa_id:-[not found]}"
            if [[ -n "$blob_sa_id" ]]; then
              import_if_exists "module.storage.azurerm_storage_account.blob[0]" "$blob_sa_id"
              blob_sa_name=$(basename "$blob_sa_id")
              prefix_no_hyphen=$(echo "$prefix" | tr -d '-')
              prefix_no_hyphen="${prefix_no_hyphen:0:18}"
              blob_suffix="${blob_sa_name#${prefix_no_hyphen}}"
              if [[ -n "$blob_suffix" && "$blob_suffix" != "$blob_sa_name" ]] && ! tf_contains "module.storage.random_string.blob_suffix[0]"; then
                echo "INFO: Importing random_string.blob_suffix[0] with value: $blob_suffix"
                terraform import 'module.storage.random_string.blob_suffix[0]' "$blob_suffix" 2>&1 || echo "WARN: Import failed for random_string.blob_suffix[0]"
              fi
            fi
          fi

          echo "OK: Import phase completed"

      - name: Terraform plan
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform plan -input=false -out=tfplan

      - name: Upload deploy plan
        uses: actions/upload-artifact@v4
        with:
          name: deploy-plan-${{ github.run_id }}
          path: ${{ env.TERRAFORM_WORKING_DIR }}/tfplan
          retention-days: 30

      - name: Terraform apply
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: terraform apply -input=false tfplan

      - name: Extract Terraform outputs
        id: tf-outputs
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          VM_IP=$(terraform output -raw vm_public_ip)
          if [[ -z "$VM_IP" ]]; then
            echo "Unable to read vm_public_ip output" >&2
            exit 1
          fi
          echo "vm_ip=$VM_IP" >> "$GITHUB_OUTPUT"
          DB_HOST=$(terraform output -raw database_fqdn)
          if [[ -z "$DB_HOST" ]]; then
            echo "Unable to read database_fqdn output" >&2
            exit 1
          fi
          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"
          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"

          if [[ "${BLOB_STORAGE_ENABLED,,}" == "true" ]]; then
            BLOB_ACCOUNT_NAME=$(terraform output -raw storage_account_name 2>/dev/null || true)
            if [[ -n "$BLOB_ACCOUNT_NAME" ]]; then
              BLOB_ACCOUNT_KEY=$(terraform output -raw storage_account_key 2>/dev/null || true)
              printf '::add-mask::%s\n' "$BLOB_ACCOUNT_KEY"
              echo "blob_account_name=$BLOB_ACCOUNT_NAME" >> "$GITHUB_OUTPUT"
              echo "BLOB_ACCOUNT_NAME=$BLOB_ACCOUNT_NAME" >> "$GITHUB_ENV"
              echo "BLOB_ACCOUNT_KEY=$BLOB_ACCOUNT_KEY" >> "$GITHUB_ENV"
            fi
          fi

      - name: Temporarily open SSH
        id: temp-ssh
        env:
          ENVIRONMENT_NAME: ${{ steps.tfvars-meta.outputs.environment_name }}
        run: |
          set -euo pipefail
          env_name=${ENVIRONMENT_NAME:-student-app}
          normalized=$(printf '%s' "$env_name" | tr '[:upper:]' '[:lower:]')
          normalized=${normalized// /-}
          prefix=${normalized:0:45}
          rg_name="${prefix}-rg"
          nsg_name="${prefix}-vm-nsg"
          RULE_NAME="gha-temp-${{ github.run_id }}"
          # Prefer lowest-available high priority to avoid colliding with existing rules
          existing_priorities=$(az network nsg rule list --resource-group "$rg_name" --nsg-name "$nsg_name" --query '[].priority' -o tsv | tr '\t' '\n' | tr -d '\r' | sed '/^$/d' || true)
          priority=4096
          if [[ -n "$existing_priorities" ]]; then
            while printf '%s\n' "$existing_priorities" | grep -qx "$priority"; do
              priority=$((priority-1))
              if (( priority < 100 )); then
                echo "Unable to find available NSG rule priority between 100-4096" >&2
                exit 1
              fi
            done
          fi
          az network nsg rule create \
            --resource-group "$rg_name" \
            --nsg-name "$nsg_name" \
            --name "$RULE_NAME" \
            --priority "$priority" \
            --direction Inbound \
            --access Allow \
            --protocol Tcp \
            --source-address-prefixes 0.0.0.0/0 \
            --source-port-ranges '*' \
            --destination-address-prefixes '*' \
            --destination-port-ranges 22 \
            --only-show-errors \
            --output none
          echo "rule_name=$RULE_NAME" >> "$GITHUB_OUTPUT"
          echo "rg_name=$rg_name" >> "$GITHUB_OUTPUT"
          echo "nsg_name=$nsg_name" >> "$GITHUB_OUTPUT"

      - name: Read sync manifest
        id: manifest
        working-directory: sync-bundle
        run: |
          IMAGE_TAG=$(jq -r '.imageTag // empty' manifest.json)
          if [[ -z "$IMAGE_TAG" || "$IMAGE_TAG" == "null" ]]; then
            IMAGE_TAG=$(git rev-parse --short=12 HEAD)
          fi
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Docker login
        run: |
          if [[ -z "$CONTAINER_REGISTRY_USERNAME" || -z "$CONTAINER_REGISTRY_PASSWORD" ]]; then
            echo "Container registry credentials are missing" >&2
            exit 1
          fi
          echo "$CONTAINER_REGISTRY_PASSWORD" | docker login "$REGISTRY_LOGIN_SERVER" -u "$CONTAINER_REGISTRY_USERNAME" --password-stdin

      - name: Build and push container image
        id: build-push
        working-directory: sync-bundle
        env:
          IMAGE_URI: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.manifest.outputs.image_tag }}
        run: |
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Decode application env file
        run: |
          if [[ -z "$APP_ENV_VARS_B64" ]]; then
            echo "APP_ENV_VARS_B64 secret is required" >&2
            exit 1
          fi
          echo "$APP_ENV_VARS_B64" | base64 -d > app.env

      - name: Append database connection string
        env:
          DB_HOST: ${{ steps.tf-outputs.outputs.db_host }}
        run: |
          set -euo pipefail
          if [[ -z "${DB_HOST:-}" || -z "${DB_ADMIN_USERNAME:-}" || -z "${DB_ADMIN_PASSWORD:-}" ]]; then
            echo "Database connection details are missing" >&2
            exit 1
          fi
          conn="Host=${DB_HOST};Port=5432;Username=${DB_ADMIN_USERNAME};Password=${DB_ADMIN_PASSWORD};Database=postgres;SslMode=Require"
          printf '::add-mask::%s\n' "$conn"
          printf '::add-mask::%s\n' "$DB_ADMIN_PASSWORD"
          {
            printf '\nPOSTGRES_CONNECTION_STRING=%s\n' "$conn"
            printf 'POSTGRES_HOST=%s\n' "$DB_HOST"
            printf 'POSTGRES_PORT=5432\n'
            printf 'POSTGRES_NAME=postgres\n'
            printf 'POSTGRES_USER=%s\n' "$DB_ADMIN_USERNAME"
            printf 'POSTGRES_PASSWORD=%s\n' "$DB_ADMIN_PASSWORD"
          } >> app.env
          if [[ "${BLOB_STORAGE_ENABLED,,}" == "true" && -n "${BLOB_ACCOUNT_NAME:-}" ]]; then
            printf '::add-mask::%s\n' "$BLOB_ACCOUNT_KEY"
            {
              printf 'AZURE_ACCOUNT_NAME=%s\n' "$BLOB_ACCOUNT_NAME"
              printf 'AZURE_ACCOUNT_KEY=%s\n' "$BLOB_ACCOUNT_KEY"
            } >> app.env
          fi

      - name: Publish app env to Key Vault
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        run: |
          set -euo pipefail
          KV="$(terraform output -raw key_vault_name)"
          # Seed the static base once, so APP_ENV_VARS_B64 can be retired later.
          if ! az keyvault secret show --vault-name "$KV" --name app-env-base >/dev/null 2>&1; then
            printf '%s' "$APP_ENV_VARS_B64" > app-env-base.b64
            az keyvault secret set --vault-name "$KV" --name app-env-base --file app-env-base.b64 -o none
            rm -f app-env-base.b64
            echo "Seeded app-env-base in Key Vault"
          fi
          # Publish the full assembled env (base64) for the VM to read at runtime.
          base64 -w0 app.env > app-env.b64
          az keyvault secret set --vault-name "$KV" --name app-env --file app-env.b64 -o none
          rm -f app-env.b64
          echo "Published app-env to Key Vault"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.VM_SSH_KEY }}

      - name: Trust VM host key
        run: |
          set -euo pipefail
          VM_IP="${{ steps.tf-outputs.outputs.vm_ip }}"
          echo "Attempting to fetch SSH host key for $VM_IP"
          for attempt in {1..5}; do
            if ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "Host key added after $attempt attempt(s)."
              exit 0
            fi
            echo "ssh-keyscan failed (attempt $attempt), retrying in 5s..." >&2
            sleep 5
          done
          echo "Warning: unable to retrieve host key; continuing because later SSH commands use StrictHostKeyChecking=no" >&2

      - name: Ensure Docker is installed on VM
        env:
          VM_IP: ${{ steps.tf-outputs.outputs.vm_ip }}
        run: |
          ssh -T -o StrictHostKeyChecking=no ${{ env.VM_SSH_USERNAME }}@${VM_IP} 'bash -s' <<'EOF'
            set -euo pipefail
            if command -v docker >/dev/null 2>&1; then
              exit 0
            fi
            echo 'Docker not found; installing...'
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg lsb-release
            sudo install -m 0755 -d /etc/apt/keyrings
            if [[ ! -f /etc/apt/keyrings/docker.gpg ]]; then
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            fi
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          EOF

      - name: Copy env file to VM
        run: scp -o StrictHostKeyChecking=no app.env ${{ env.VM_SSH_USERNAME }}@${{ steps.tf-outputs.outputs.vm_ip }}:/home/${{ env.VM_SSH_USERNAME }}/app.env

      - name: Load env on VM from Key Vault (fallback to scp'd file)
        working-directory: ${{ env.TERRAFORM_WORKING_DIR }}
        env:
          VM_IP: ${{ steps.tf-outputs.outputs.vm_ip }}
        run: |
          set -euo pipefail
          KV_HOST="$(terraform output -raw key_vault_name).vault.azure.net"
          APP_USER='${{ env.VM_SSH_USERNAME }}'
          ssh -o StrictHostKeyChecking=no "$APP_USER@${VM_IP}" "KV_HOST='$KV_HOST' APP_USER='$APP_USER' bash -s" <<'EOF'
            set -uo pipefail
            TOKEN=$(curl -s -H 'Metadata: true' "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net" | python3 -c 'import sys,json;print(json.load(sys.stdin)["access_token"])' 2>/dev/null || true)
            if [ -n "$TOKEN" ]; then
              VAL=$(curl -s -H "Authorization: Bearer $TOKEN" "https://$KV_HOST/secrets/app-env?api-version=7.4" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",""))' 2>/dev/null || true)
              if [ -n "$VAL" ]; then
                echo "$VAL" | base64 -d > "/home/$APP_USER/app.env"
                echo "app.env loaded from Key Vault via managed identity"
              else
                echo "Key Vault returned empty/denied; keeping scp'd app.env" >&2
              fi
            else
              echo "No managed-identity token; keeping scp'd app.env" >&2
            fi
          EOF

      - name: Deploy container on VM
        env:
          IMAGE_URI: ${{ steps.build-push.outputs.image_uri }}
          VM_IP: ${{ steps.tf-outputs.outputs.vm_ip }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.VM_SSH_USERNAME }}@${VM_IP} "
            set -euo pipefail
            sudo mkdir -p /etc/letsencrypt
            sudo docker login ${REGISTRY_LOGIN_SERVER} -u '${CONTAINER_REGISTRY_USERNAME}' -p '${CONTAINER_REGISTRY_PASSWORD}'
            sudo docker pull ${IMAGE_URI}
            sudo docker stop ${CONTAINER_SERVICE_NAME} || true
            sudo docker rm ${CONTAINER_SERVICE_NAME} || true
            sudo docker run -d --name ${CONTAINER_SERVICE_NAME} --env-file /home/${{ env.VM_SSH_USERNAME }}/app.env -p ${CONTAINER_HTTP_PORT}:${CONTAINER_INTERNAL_HTTP_PORT} -p ${CONTAINER_HTTPS_PORT}:${CONTAINER_INTERNAL_HTTPS_PORT} -v /etc/letsencrypt:/etc/letsencrypt --restart unless-stopped ${IMAGE_URI}
          "

      - name: Remove temporary SSH rule
        if: always() && steps.temp-ssh.outputs.rule_name != ''
        run: |
          set -euo pipefail
          az network nsg rule delete \
            --resource-group "${{ steps.temp-ssh.outputs.rg_name }}" \
            --nsg-name "${{ steps.temp-ssh.outputs.nsg_name }}" \
            --name "${{ steps.temp-ssh.outputs.rule_name }}" \
            --only-show-errors \
            --output none

  cleanup:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    permissions:
      contents: write
      actions: write
    steps:
      - name: Delete sync branch
        if: ${{ startsWith(needs.deploy.outputs.sync_branch, 'sync/') }}
        uses: actions/github-script@v7
        with:
          script: |
            const branch = '${{ needs.deploy.outputs.sync_branch }}';
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
              core.info(`Deleted sync branch ${branch}`);
            } catch (error) {
              core.warning(`Could not delete branch ${branch}: ${error.message}`);
            }
